apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Migrations are idempotent and serialized by a PostgreSQL advisory lock,
      # so every replica can run them safely before it starts.
      initContainers:
        - name: migrate
          image: orderlab
          command: [python, scripts/migrate.py]
          env:
            # Password via libpq's PGPASSWORD: generated passwords may contain URL-breaking characters.
            - name: DATABASE_URL
              value: postgresql://lab@postgres:5432/orders
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderlab-secrets
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: api
          image: orderlab
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://lab@postgres:5432/orders
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderlab-secrets
                  key: POSTGRES_PASSWORD
            - name: LAB_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orderlab-secrets
                  key: LAB_ADMIN_TOKEN
            - name: PAYMENTS_URL
              value: http://payments:8000
            - name: DB_POOL_SIZE
              value: "8"
            - name: DEPENDENCY_TIMEOUT
              value: "0.4"
            - name: DEPENDENCY_ATTEMPTS
              value: "3"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
