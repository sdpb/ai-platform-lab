apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 8000
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
spec:
  replicas: 2
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 50
        - pause: {duration: 60s}
        - analysis:
            templates:
              - templateName: api-canary-sli
            args:
              - name: stable-hash
                valueFrom: {podTemplateHashValue: Stable}
              - name: latest-hash
                valueFrom: {podTemplateHashValue: Latest}
        - setWeight: 100
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # preStop drain (10 s) + uvicorn --timeout-graceful-shutdown (20 s) must fit inside this.
      terminationGracePeriodSeconds: 40
      # One replica per node when possible, so losing a node does not take the whole API down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
          matchLabelKeys: [pod-template-hash] # count only this revision, not pods a rollout is replacing
      # Migrations are idempotent and serialized by a PostgreSQL advisory lock,
      # so every replica can run them safely before it starts.
      initContainers:
        - name: migrate
          image: orderlab
          command: [python, scripts/migrate.py, --through, "003"]
          env:
            # Password via libpq's PGPASSWORD: generated passwords may contain URL-breaking characters.
            - name: DATABASE_URL
              value: postgresql://lab@postgres:5432/orders
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderlab-secrets
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: api
          image: orderlab
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://lab@postgres:5432/orders
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderlab-secrets
                  key: POSTGRES_PASSWORD
            - name: LAB_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orderlab-secrets
                  key: LAB_ADMIN_TOKEN
            - name: PAYMENTS_URL
              value: http://payments:8000
            - name: DB_POOL_SIZE
              value: "8"
            - name: DEPENDENCY_TIMEOUT
              value: "0.4"
            - name: DEPENDENCY_ATTEMPTS
              value: "3"
          # Startup gets up to 180 s (36 x 5 s); liveness and readiness only begin after it passes,
          # so a slow start is never mistaken for a hung process.
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 5
            failureThreshold: 36
          # Readiness checks the database only: a payment outage must not empty the Service.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 10
          # Keep serving while kube-proxy removes this pod from the Service; then SIGTERM drains in-flight work.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources: # memory request = limit: usage never exceeds the request, so node memory pressure evicts this pod last
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
