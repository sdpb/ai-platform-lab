apiVersion: v1
kind: Service
metadata:
  name: payments
spec:
  selector:
    app.kubernetes.io/name: payments
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
spec:
  replicas: 1 # fault switches live in process memory; one replica keeps experiments deterministic
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payments
          image: orderlab
          command: [uvicorn, "orderlab.payments:app", --host, "0.0.0.0", --port, "8000", --workers, "1", --no-access-log]
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://lab@postgres:5432/orders
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderlab-secrets
                  key: POSTGRES_PASSWORD
            - name: LAB_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orderlab-secrets
                  key: LAB_ADMIN_TOKEN
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 5
          livenessProbe: # the stub has no /health/live yet; stage 2 adds one
            tcpSocket:
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
