# Seeded: a CPU limit below what the handler needs (throttling) and a tight memory limit the leak will hit.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target: {kind: Deployment, name: app}
    patch: |
      - {op: replace, path: /spec/template/spec/containers/0/args, value: ["seeded:app"]}
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 100m, memory: 128Mi}}
