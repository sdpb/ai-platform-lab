name: PR Checks
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  checkov:
    name: Checkov (Terraform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run Checkov on platform/terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: platform/terraform
          framework: terraform
          quiet: true
          output_format: cli
          soft_fail: false
          # Accepted lab-scale tradeoffs (cost/complexity); revisit in a hardening pass.
          # DynamoDB PITR/CMK, S3 logging/replication/lifecycle/notifications,
          # ECR CMK, KMS key policy, Secrets rotation.
          skip_check: CKV_AWS_28,CKV_AWS_119,CKV_AWS_136,CKV_AWS_18,CKV_AWS_144,CKV2_AWS_61,CKV2_AWS_62,CKV2_AWS_64,CKV2_AWS_57
