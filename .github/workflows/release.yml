name: Release Pipeline
on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # Two runs for the same commit must not push the same immutable tag concurrently
    concurrency:
      group: build-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write      # Required for OIDC
      attestations: write  # Required for generating provenance
    outputs:
      image-digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials for Build
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable, so a re-run of the same commit (re-run jobs, flaky later step)
      # must reuse the image already pushed for this SHA instead of pushing it again.
      # batch-get-image is already allowed by the build role; no extra IAM needed.
      - name: Look up existing image for this commit
        id: existing
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DIGEST=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'images[0].imageId.imageDigest' --output text)
          if [ -n "$DIGEST" ] && [ "$DIGEST" != "None" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
            echo "Tag $IMAGE_TAG already exists ($DIGEST); reusing it, skipping build and push." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY
          if [ "${{ steps.existing.outputs.found }}" = "true" ]; then
            echo "digest=$EXISTING_DIGEST" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker build -t $IMAGE_URI:$IMAGE_TAG .
          docker push $IMAGE_URI:$IMAGE_TAG
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE_URI:$IMAGE_TAG | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Generate build attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
          push-to-registry: false

      # SBOM of the exact pushed image (by digest), attested so consumers can verify it
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build-image.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    concurrency: staging
    permissions:
      contents: read
      id-token: write     # Required for OIDC
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials for Deploy
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify build provenance and SBOM attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          gh attestation verify oci://$ECR_REGISTRY/$ECR_REPOSITORY@${{ needs.build-and-push.outputs.image-digest }} -o ${{ github.repository_owner }}
          gh attestation verify oci://$ECR_REGISTRY/$ECR_REPOSITORY@${{ needs.build-and-push.outputs.image-digest }} -o ${{ github.repository_owner }} --predicate-type https://cyclonedx.org/bom

      - name: Initialize environment
        run: python3 scripts/lab.py init

      - name: Deploy to Staging
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          # Pull the image so `scripts/release.py` can inspect its ID locally
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY@${{ needs.build-and-push.outputs.image-digest }}
          python3 scripts/release.py --candidate $ECR_REGISTRY/$ECR_REPOSITORY@${{ needs.build-and-push.outputs.image-digest }} --baseline evidence/baseline.json

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials for Deploy
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify build provenance and SBOM attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          gh attestation verify oci://$ECR_REGISTRY/$ECR_REPOSITORY@${{ needs.build-and-push.outputs.image-digest }} -o ${{ github.repository_owner }}
          gh attestation verify oci://$ECR_REGISTRY/$ECR_REPOSITORY@${{ needs.build-and-push.outputs.image-digest }} -o ${{ github.repository_owner }} --predicate-type https://cyclonedx.org/bom

      - name: Initialize environment
        run: python3 scripts/lab.py init

      - name: Deploy to Production
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY@${{ needs.build-and-push.outputs.image-digest }}
          python3 scripts/release.py --candidate $ECR_REGISTRY/$ECR_REPOSITORY@${{ needs.build-and-push.outputs.image-digest }} --baseline evidence/baseline.json
