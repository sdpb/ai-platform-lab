name: Release Pipeline
on:
  push:
    branches: [ "main" ]
    # Infra and docs changes do not change the image; terraform.yml handles infra.
    paths-ignore:
      - "platform/terraform/**"
      - "missions/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/pr.yml"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # Two runs for the same commit must not push the same immutable tag concurrently
    concurrency:
      group: build-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write      # Required for OIDC
      attestations: write  # Required for generating provenance
    outputs:
      image-digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials for Build
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable, so a re-run of the same commit (re-run jobs, flaky later step)
      # must reuse the image already pushed for this SHA instead of pushing it again.
      # batch-get-image is already allowed by the build role; no extra IAM needed.
      - name: Look up existing image for this commit
        id: existing
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DIGEST=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'images[0].imageId.imageDigest' --output text)
          if [ -n "$DIGEST" ] && [ "$DIGEST" != "None" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
            echo "Tag $IMAGE_TAG already exists ($DIGEST); reusing it, skipping build and push." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY
          if [ "${{ steps.existing.outputs.found }}" = "true" ]; then
            echo "digest=$EXISTING_DIGEST" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker build -t $IMAGE_URI:$IMAGE_TAG .
          docker push $IMAGE_URI:$IMAGE_TAG
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE_URI:$IMAGE_TAG | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      # test.yml scanned a different local build; gate the exact digest we attest and deploy.
      - name: Scan pushed image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build-image.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate build attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
          push-to-registry: false

      # SBOM of the exact pushed image (by digest), attested so consumers can verify it
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build-image.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json

  deploy-staging:
    needs: build-and-push
    runs-on: [self-hosted, kind]
    environment: staging
    concurrency: staging
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ENV: staging
    steps:
      - uses: actions/checkout@v7

      - name: Ensure the kind cluster is ready
        run: make k8s-cluster

      - name: Configure AWS credentials for Deploy
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify build provenance and SBOM attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          gh attestation verify oci://$ECR_REGISTRY/$ECR_REPOSITORY@${{ needs.build-and-push.outputs.image-digest }} -R ${{ github.repository }}
          gh attestation verify oci://$ECR_REGISTRY/$ECR_REPOSITORY@${{ needs.build-and-push.outputs.image-digest }} -R ${{ github.repository }} --predicate-type https://cyclonedx.org/bom

      - name: Deploy the attested image under the rollout gate
        env:
          SECRET_ID: ${{ env.ENV }}/orderlab-secrets
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/$ECR_REPOSITORY@${{ needs.build-and-push.outputs.image-digest }}"
          ready=$(kubectl --context kind-orderlab -n "orderlab-$ENV" get deployment api -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0)
          if [ "${ready:-0}" -gt 0 ]; then
            WAIT=0 scripts/rollout-gate.sh "orderlab-$ENV" scripts/kind-deploy.sh "$ENV" "$image"
          else
            scripts/kind-deploy.sh "$ENV" "$image"
          fi

  deploy-production:
    needs: [build-and-push, deploy-staging]
    runs-on: [self-hosted, kind]
    environment: production
    concurrency: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ENV: production
    steps:
      - uses: actions/checkout@v7

      - name: Ensure the kind cluster is ready
        run: make k8s-cluster

      - name: Configure AWS credentials for Deploy
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify build provenance and SBOM attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          gh attestation verify oci://$ECR_REGISTRY/$ECR_REPOSITORY@${{ needs.build-and-push.outputs.image-digest }} -R ${{ github.repository }}
          gh attestation verify oci://$ECR_REGISTRY/$ECR_REPOSITORY@${{ needs.build-and-push.outputs.image-digest }} -R ${{ github.repository }} --predicate-type https://cyclonedx.org/bom

      - name: Deploy the staging-tested image under the rollout gate
        env:
          SECRET_ID: ${{ env.ENV }}/orderlab-secrets
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/$ECR_REPOSITORY@${{ needs.build-and-push.outputs.image-digest }}"
          ready=$(kubectl --context kind-orderlab -n "orderlab-$ENV" get deployment api -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0)
          if [ "${ready:-0}" -gt 0 ]; then
            WAIT=0 scripts/rollout-gate.sh "orderlab-$ENV" scripts/kind-deploy.sh "$ENV" "$image"
          else
            scripts/kind-deploy.sh "$ENV" "$image"
          fi
          make k8s-smoke ENV="$ENV"
