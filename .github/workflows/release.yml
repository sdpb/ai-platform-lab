name: Release Pipeline
on:
  push:
    branches: [ "main" ]
    # Infra and docs changes do not change the image; terraform.yml handles infra.
    paths-ignore:
      - "platform/terraform/**"
      - "missions/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/pr.yml"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # Two runs for the same commit must not push the same immutable tag concurrently
    concurrency:
      group: build-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write      # Required for OIDC
      attestations: write  # Required for generating provenance
    outputs:
      image-digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials for Build
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Tags are immutable, so a re-run of the same commit (re-run jobs, flaky later step)
      # must reuse the image already pushed for this SHA instead of pushing it again.
      # batch-get-image is already allowed by the build role; no extra IAM needed.
      - name: Look up existing image for this commit
        id: existing
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DIGEST=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'images[0].imageId.imageDigest' --output text)
          if [ -n "$DIGEST" ] && [ "$DIGEST" != "None" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
            echo "Tag $IMAGE_TAG already exists ($DIGEST); reusing it, skipping build and push." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY
          if [ "${{ steps.existing.outputs.found }}" = "true" ]; then
            echo "digest=$EXISTING_DIGEST" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # amd64 for cloud runners, arm64 for the kind cluster on the Apple-silicon runner.
          # One index digest covers both; provenance comes from the GitHub attestation below.
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
            -t $IMAGE_URI:$IMAGE_TAG --metadata-file meta.json --push .
          echo "digest=$(jq -r '.["containerimage.digest"]' meta.json)" >> "$GITHUB_OUTPUT"

      # test.yml scanned a different local build; gate the exact digest we attest and deploy.
      - name: Scan pushed image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build-image.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # The scan above pulls the runner's platform (amd64); kind runs the arm64 variant.
      - name: Scan pushed image, arm64 variant (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build-image.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate build attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
          push-to-registry: false

      # SBOM of the exact pushed image (by digest), attested so consumers can verify it
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build-image.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json

  # Deploy jobs run on the self-hosted runner next to the local kind cluster (label `kind`).
  # Public repo: only this workflow targets that label, it runs only on pushes to main, and each
  # job is gated by its GitHub environment. PR workflows always use GitHub-hosted runners.
  deploy-staging:
    needs: build-and-push
    runs-on: [self-hosted, kind]
    environment: staging
    concurrency: staging
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write     # Required for OIDC
    env:
      ENV: staging
    steps:
      - uses: actions/checkout@v7

      - name: Ensure kind cluster add-ons are ready
        run: make k8s-cluster

      - name: Verify Argo Rollouts CLI when the controller is installed
        run: |
          if kubectl --context kind-orderlab get crd rollouts.argoproj.io >/dev/null 2>&1; then
            kubectl argo rollouts version | tee /tmp/argo-rollouts-version
            grep -Fq 'v1.10.2' /tmp/argo-rollouts-version
          fi

      - name: Configure AWS credentials for Deploy
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve image
        id: image
        run: |
          REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
          echo "ref=$REGISTRY/${{ vars.ECR_REPOSITORY }}@${{ needs.build-and-push.outputs.image-digest }}" >> "$GITHUB_OUTPUT"

      - name: Verify build provenance and SBOM attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify oci://${{ steps.image.outputs.ref }} -R ${{ github.repository }}
          gh attestation verify oci://${{ steps.image.outputs.ref }} -R ${{ github.repository }} --predicate-type https://cyclonedx.org/bom

      - name: Deploy the attested digest to kind (with rollout gate on updates)
        env:
          SECRET_ID: ${{ env.ENV }}/orderlab-secrets
        run: |
          mkdir -p evidence/pipeline
          set -o pipefail
          if kubectl --context kind-orderlab get crd rollouts.argoproj.io >/dev/null 2>&1; then
            READY=$(kubectl --context kind-orderlab -n "orderlab-$ENV" get rollout api -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0)
          else
            READY=$(kubectl --context kind-orderlab -n "orderlab-$ENV" get deployment api -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0)
          fi
          if [ "${READY:-0}" -gt 0 ]; then
            WAIT=0 scripts/rollout-gate.sh "orderlab-$ENV" scripts/kind-deploy.sh "$ENV" "${{ steps.image.outputs.ref }}" 2>&1 | tee evidence/pipeline/deploy.txt
          else
            scripts/kind-deploy.sh "$ENV" "${{ steps.image.outputs.ref }}" 2>&1 | tee evidence/pipeline/deploy.txt
          fi

      # The stage 2 runtime guarantees, re-proven on every release against the shipped image.
      - name: Runtime tests (smoke, shutdown under load, slow start, dependency outage)
        run: |
          set -o pipefail
          for t in smoke shutdown-test slow-start-test dependency-test; do
            echo "::group::$t"
            make --no-print-directory k8s-$t ENV="$ENV" 2>&1 | tee "evidence/pipeline/$t.txt"
            echo "::endgroup::"
          done

      - name: Evidence summary
        if: always()
        run: |
          {
            echo "### Staging on kind: ${{ steps.image.outputs.ref }}"
            echo '```'
            grep -hE 'deployed|http_req_failed|checks|RESTARTS|^api-|FAIL' evidence/pipeline/*.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-staging-${{ github.sha }}
          path: evidence/pipeline/

  deploy-production:
    needs: [build-and-push, deploy-staging]
    runs-on: [self-hosted, kind]
    environment: production
    concurrency: production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      ENV: production
    steps:
      - uses: actions/checkout@v7

      - name: Ensure kind cluster add-ons are ready
        run: make k8s-cluster

      - name: Verify Argo Rollouts CLI when the controller is installed
        run: |
          if kubectl --context kind-orderlab get crd rollouts.argoproj.io >/dev/null 2>&1; then
            kubectl argo rollouts version | tee /tmp/argo-rollouts-version
            grep -Fq 'v1.10.2' /tmp/argo-rollouts-version
          fi

      - name: Configure AWS credentials for Deploy
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve image
        id: image
        run: |
          REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
          echo "ref=$REGISTRY/${{ vars.ECR_REPOSITORY }}@${{ needs.build-and-push.outputs.image-digest }}" >> "$GITHUB_OUTPUT"

      - name: Verify build provenance and SBOM attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify oci://${{ steps.image.outputs.ref }} -R ${{ github.repository }}
          gh attestation verify oci://${{ steps.image.outputs.ref }} -R ${{ github.repository }} --predicate-type https://cyclonedx.org/bom

      # Same digest staging tested: promoted, never rebuilt.
      - name: Deploy the attested digest to kind (with rollout gate on updates)
        env:
          SECRET_ID: ${{ env.ENV }}/orderlab-secrets
        run: |
          mkdir -p evidence/pipeline
          set -o pipefail
          if kubectl --context kind-orderlab get crd rollouts.argoproj.io >/dev/null 2>&1; then
            READY=$(kubectl --context kind-orderlab -n "orderlab-$ENV" get rollout api -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0)
          else
            READY=$(kubectl --context kind-orderlab -n "orderlab-$ENV" get deployment api -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0)
          fi
          if [ "${READY:-0}" -gt 0 ]; then
            WAIT=0 scripts/rollout-gate.sh "orderlab-$ENV" scripts/kind-deploy.sh "$ENV" "${{ steps.image.outputs.ref }}" 2>&1 | tee evidence/pipeline/deploy.txt
          else
            scripts/kind-deploy.sh "$ENV" "${{ steps.image.outputs.ref }}" 2>&1 | tee evidence/pipeline/deploy.txt
          fi
          make --no-print-directory k8s-smoke ENV="$ENV" 2>&1 | tee evidence/pipeline/smoke.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-production-${{ github.sha }}
          path: evidence/pipeline/
